# Local development infrastructure. Usage: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market
    ports: ['5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U market']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  s3:
    # S3-compatible object storage (SeaweedFS). Any access key/secret is accepted locally.
    image: chrislusf/seaweedfs:4.52
    command: server -s3 -dir=/data
    ports: ['8333:8333']
    volumes: [s3data:/data]
volumes:
  pgdata:
  s3data:
